name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*public const VERSION = '\([^']*\)';.*/\1/p" src/ApplicationFactory.php)"
          if [[ -z "$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unable to resolve a valid project version from src/ApplicationFactory.php" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes from changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { capture = 1 }
            capture && /^## \[/ && index($0, header) != 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md does not contain a release section for $VERSION" >&2
            exit 1
          fi

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          ini-values: phar.readonly=0
          tools: box:4.7.0

      - name: Build the release PHAR
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts --no-dev
          box validate box.json.dist
          box compile --config=box.json.dist --no-parallel

      - name: Verify and checksum the release PHAR
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          phar=build/php-modern-guidelines.phar
          fixture=tests/fixtures/projects/caret-8-2
          actual="$(php "$phar" version)"
          if [[ "$actual" != "php-modern-guidelines $VERSION" ]]; then
            echo "PHAR reports \"$actual\", expected \"php-modern-guidelines $VERSION\"" >&2
            exit 1
          fi
          php "$phar" resolve --project-root="$fixture" --json > /dev/null
          php "$phar" list-rules --project-root="$fixture" --kind=deprecated > /dev/null
          php "$phar" explain language.property_hooks --project-root="$fixture" --json > /dev/null
          php "$phar" doctor --project-root="$fixture" --json > /dev/null
          ( cd build && sha256sum php-modern-guidelines.phar > php-modern-guidelines.phar.sha256 )

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            build/php-modern-guidelines.phar \
            build/php-modern-guidelines.phar.sha256
