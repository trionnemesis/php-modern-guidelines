name: Issue 19 implementation helper

on:
  push:
    branches:
      - issue-19-bcmath-number

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: issue-19-bcmath-number
          fetch-depth: 0
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Apply scoped source and test changes
        run: python3 .github/issue19_apply.py apply

      - name: Install source dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts

      - name: Regenerate affected CLI goldens and Skill examples
        run: python3 .github/issue19_apply.py regenerate

      - name: Validate scoped changes before committing
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/Unit/Rule/BcMathNumberApplicabilityTest.php
          php -l tests/Integration/BcMathNumberPhpCompatibilityAnalyzerTest.php
          php -l tests/fixtures/verification/projects/phpcompatibility-bcmath-number/src/bcmath_number.php
          vendor/bin/phpunit --no-coverage \
            tests/Unit/Rule/SeedRuleCatalogueTest.php \
            tests/Unit/Rule/BcMathNumberApplicabilityTest.php \
            tests/Unit/Verification/Adapter/PhpCompatibilityMappingTest.php \
            tests/Integration/ListCommandTest.php \
            tests/Integration/DoctorCommandTest.php \
            tests/Unit/Skill \
            tests/Integration/SkillExamplesTest.php
          vendor/bin/phpstan analyse --memory-limit=1G
          vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Commit implementation without helper tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f composer.lock
          git rm .github/workflows/issue-19-apply.yml .github/issue19_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: add BcMath Number catalogue rule"
          git push origin HEAD:issue-19-bcmath-number
