name: Issue 19 implementation helper

on:
  push:
    branches:
      - issue-19-bcmath-number

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: issue-19-bcmath-number
          fetch-depth: 0
          persist-credentials: true

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Apply the scoped source and test changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
              write(path, text.replace(old, new, 1))

          def insert_unreleased_note(path: str, marker: str, note: str) -> None:
              text = read(path)
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{path}: release marker not found: {marker!r}')
              match = re.search(r'\n## ', text[start:])
              if match is None:
                  raise SystemExit(f'{path}: could not find heading after release marker')
              index = start + match.start()
              if note in text:
                  raise SystemExit(f'{path}: unreleased note already present unexpectedly')
              write(path, text[:index] + '\n\n' + note + text[index:])

          rule = {
              'schema_version': '1.1.0',
              'id': 'extension.bcmath_number',
              'title': 'BcMath\\Number',
              'summary': 'PHP 8.4 added the immutable BcMath\\Number value object for arbitrary-precision decimal arithmetic, with object-returning arithmetic methods and operator support alongside the existing procedural BCMath APIs.',
              'category': 'extension',
              'kind': 'feature',
              'priority': 'P1',
              'introduced_in': '8.4',
              'deprecated_in': None,
              'removed_in': None,
              'extension': 'bcmath',
              'package_constraints': {},
              'behavior_change_risk': 'low',
              'new_code_policy': 'When the project feature ceiling is PHP 8.4 or newer, BcMath\\Number is available as an immutable object-oriented representation for arbitrary-precision decimal values. Keep decimal inputs as strings and pass scale explicitly when the result scale matters. The procedural bc* APIs remain valid and are not deprecated, so choosing BcMath\\Number is an API-design decision rather than a required migration.',
              'existing_code_policy': 'Do not mechanically rewrite working procedural BCMath code. Once the project floor reaches PHP 8.4, consider BcMath\\Number where immutable value-object semantics improve the surrounding design, while preserving decimal-string input boundaries and explicit scale decisions. In strict-types code, do not replace a decimal string with a float constructor argument: the measured PHP 8.4 runtime rejects that argument with TypeError.',
              'guideline': 'Use BcMath\\Number on PHP 8.4+ when immutable object-oriented arbitrary-precision decimal values fit the design; preserve decimal strings and explicit scale, and keep procedural BCMath code when it is already the clearer interface.',
              'details': 'PHP 8.4 UPGRADING section 7 (BCMath) adds the immutable BcMath\\Number class, whose arithmetic methods return objects and which supports arithmetic operators. This is a feature rule, so applicability is governed by the project feature floor: the class must not be emitted for a project that still supports PHP 8.2 or 8.3. The issue #19 runtime probe on PHP 8.4.25 measured new BcMath\\Number(\'1.20\')->add(\'0.035\', 3) as a new object with decimal value 1.235 and scale 3 while the original remains 1.20 with scale 2; procedural bcadd() produced the same decimal string. The same probe measured a float constructor argument under strict types raising TypeError. None of this deprecates or invalidates the procedural BCMath API.',
              'examples': [
                  {
                      'before': [
                          "$amount = new \\BcMath\\Number(1.20);"
                      ],
                      'after': [
                          "$amount = new \\BcMath\\Number('1.20');",
                          "$total = $amount->add('0.035', 3);"
                      ]
                  }
              ],
              'verification': {
                  'phpcompatibility': [
                      'PHPCompatibility.Classes.NewClasses.bcmath_numberFound'
                  ],
                  'phpstan': None,
                  'rector': None
              },
              'sources': [
                  {
                      'type': 'php_source_upgrading',
                      'url': 'https://raw.githubusercontent.com/php/php-src/php-8.4.0/UPGRADING',
                      'checked_at': '2026-09-14'
                  }
              ],
              'notes': [
                  'Procedural BCMath functions remain supported; this feature rule does not mark them deprecated and does not require an automatic rewrite to BcMath\\Number.',
                  'Pinned analyzer probe from issue #19 (PHP_CodeSniffer 3.13.6 + PHPCompatibility 10.0.0-alpha2): PHPCompatibility.Classes.NewClasses.bcmath_numberFound produced 1 / 1 / 0 / 0 findings with the ceiling held at 8.5 and floors set to 8.2 / 8.3 / 8.4 / 8.5, establishing introduced_in: 8.4.',
                  'Runtime evidence from issue #19 on PHP 8.4.25: new BcMath\\Number(\'1.20\')->add(\'0.035\', 3) produced value 1.235 at scale 3, the original remained 1.20 at scale 2, and procedural bcadd() produced the same decimal string; a float constructor argument raised TypeError under strict types.',
                  'The same issue #19 probe produced no PHPCompatibility findings for static Dom\\HTMLDocument::createFromString or Dom\\XMLDocument::createFromString calls. This rule therefore adds no DOM mapping and makes no claim of exhaustive DOM coverage.'
              ]
          }
          write('resources/rules/extension.bcmath_number.json', json.dumps(rule, indent=4, ensure_ascii=False) + '\n')

          mapping_anchor = "        'PHPCompatibility.Classes.ForbiddenClassNameUnderscore.Deprecated' => ['core.underscore_class_name'],\n"
          mapping_line = "        'PHPCompatibility.Classes.NewClasses.bcmath_numberFound' => ['extension.bcmath_number'],\n"
          replace_once(
              'src/Verification/Adapter/PhpCompatibilityAdapter.php',
              mapping_anchor,
              mapping_anchor + mapping_line,
          )
          replace_once(
              'tests/Unit/Verification/Adapter/PhpCompatibilityMappingTest.php',
              mapping_anchor,
              mapping_anchor + mapping_line,
          )

          replace_once(
              'tests/Unit/Rule/SeedRuleCatalogueTest.php',
              'the exactly-80-files count',
              'the exactly-81-files count',
          )
          replace_once(
              'tests/Unit/Rule/SeedRuleCatalogueTest.php',
              'private const EXPECTED_COUNT = 80;',
              'private const EXPECTED_COUNT = 81;',
          )
          replace_once(
              'tests/Unit/Rule/SeedRuleCatalogueTest.php',
              "private const REVIEW_DATES = ['2026-08-30', '2026-09-04', '2026-09-05', '2026-09-06', '2026-09-07'];",
              "private const REVIEW_DATES = ['2026-08-30', '2026-09-04', '2026-09-05', '2026-09-06', '2026-09-07', '2026-09-14'];",
          )
          replace_once(
              'tests/Unit/Rule/SeedRuleCatalogueTest.php',
              'public function testExactlyEightyRuleFilesAreShipped(): void',
              'public function testExactlyEightyOneRuleFilesAreShipped(): void',
          )
          replace_once(
              'tests/Unit/Rule/SeedRuleCatalogueTest.php',
              "            'extension.bcmath_rounding_functions',\n",
              "            'extension.bcmath_number',\n            'extension.bcmath_rounding_functions',\n",
          )

          applicability_test = r'''<?php

declare(strict_types=1);

namespace ModernPhpGuidelines\Tests\Unit\Rule;

use ModernPhpGuidelines\Rule\ApplicabilityEvaluator;
use ModernPhpGuidelines\Rule\ApplicabilityStatus;
use ModernPhpGuidelines\Rule\RuleLoader;
use ModernPhpGuidelines\Support\JsonSchemaValidator;
use ModernPhpGuidelines\Support\PackagePaths;
use PHPUnit\Framework\Attributes\DataProvider;
use PHPUnit\Framework\TestCase;

final class BcMathNumberApplicabilityTest extends TestCase
{
    use RuleFixtures;

    /**
     * @return iterable<string, array{list<string>, string, string, ApplicabilityStatus}>
     */
    public static function policyCases(): iterable
    {
        yield 'single PHP 8.2 does not contain the feature' => [
            ['8.2'],
            '8.2',
            '8.2',
            ApplicabilityStatus::NotInRange,
        ];
        yield 'broad range with an 8.2 floor forbids the feature' => [
            ['8.2', '8.3', '8.4', '8.5'],
            '8.2',
            '8.5',
            ApplicabilityStatus::ForbiddenAboveFeatureCeiling,
        ];
        yield 'an 8.4 floor makes the feature applicable' => [
            ['8.4', '8.5'],
            '8.4',
            '8.5',
            ApplicabilityStatus::Applicable,
        ];
    }

    /** @param list<string> $allowedMinors */
    #[DataProvider('policyCases')]
    public function testBcMathNumberUsesTheFeatureAxis(
        array $allowedMinors,
        string $featureCeiling,
        string $lifecycleCeiling,
        ApplicabilityStatus $expected,
    ): void {
        $rule = (new RuleLoader(new JsonSchemaValidator(PackagePaths::ruleSchemaPath())))
            ->loadDirectory(PackagePaths::rulesDirectory())
            ->get('extension.bcmath_number');

        self::assertSame('8.4', $rule->introducedIn);

        $result = (new ApplicabilityEvaluator())->evaluate(
            $rule,
            self::makePolicy($allowedMinors, $featureCeiling, $lifecycleCeiling),
        );

        self::assertSame($expected, $result->status);
    }
}
'''
          write('tests/Unit/Rule/BcMathNumberApplicabilityTest.php', applicability_test)

          fixture_composer = '''{
              "name": "fixture/phpcompatibility-bcmath-number",
              "require": {
                  "php": "^8.2"
              }
          }
          '''
          write('tests/fixtures/verification/projects/phpcompatibility-bcmath-number/composer.json', fixture_composer)
          fixture_php = r'''<?php

declare(strict_types=1);

$value = new \BcMath\Number('1.20');
'''
          write('tests/fixtures/verification/projects/phpcompatibility-bcmath-number/src/bcmath_number.php', fixture_php)

          analyzer_test = r'''<?php

declare(strict_types=1);

namespace ModernPhpGuidelines\Tests\Integration;

use ModernPhpGuidelines\ApplicationFactory;
use ModernPhpGuidelines\Command\ExitCode;
use ModernPhpGuidelines\Tests\Support\FixtureTreeSnapshot;
use ModernPhpGuidelines\Verification\Process\NativeProcessRunner;
use PHPUnit\Framework\Attributes\DataProvider;
use PHPUnit\Framework\Attributes\Group;
use PHPUnit\Framework\TestCase;
use Symfony\Component\Console\Tester\ApplicationTester;

#[Group('real-analyzer')]
final class BcMathNumberPhpCompatibilityAnalyzerTest extends TestCase
{
    private const PROJECT_PATH = __DIR__ . '/../fixtures/verification/projects/phpcompatibility-bcmath-number';

    private string $executable = '';

    /**
     * @return iterable<string, array{string, list<string>, int}>
     */
    public static function floorCases(): iterable
    {
        yield 'floor 8.2' => ['>=8.2 <8.6', ['8.2', '8.3', '8.4', '8.5'], 1];
        yield 'floor 8.3' => ['>=8.3 <8.6', ['8.3', '8.4', '8.5'], 1];
        yield 'floor 8.4' => ['>=8.4 <8.6', ['8.4', '8.5'], 0];
        yield 'floor 8.5' => ['>=8.5 <8.6', ['8.5'], 0];
    }

    protected function setUp(): void
    {
        if (PHP_OS_FAMILY === 'Windows') {
            self::markTestSkipped('The pinned analyzer used by this group targets POSIX hosts only.');
        }

        if (!NativeProcessRunner::isSupportedOnCurrentPlatform()) {
            self::markTestSkipped(
                'This case executes a child process through the core executor, which requires operational '
                . 'Linux user/PID-namespace isolation.',
            );
        }

        $executable = getenv('MODERN_PHP_GUIDELINES_PHPCS');
        if (!is_string($executable)
            || $executable === ''
            || !is_file($executable)
            || !is_executable($executable)) {
            self::markTestSkipped(
                'MODERN_PHP_GUIDELINES_PHPCS must name an existing, executable, pinned PHP_CodeSniffer binary.',
            );
        }

        $this->executable = $executable;
    }

    /** @param list<string> $expectedMinors */
    #[DataProvider('floorCases')]
    public function testFloorBoundaryIsMeasuredByTheRealAnalyzer(
        string $phpConstraint,
        array $expectedMinors,
        int $expectedFindingCount,
    ): void {
        $project = realpath(self::PROJECT_PATH);
        self::assertIsString($project);
        $before = FixtureTreeSnapshot::capture($project);

        $application = ApplicationFactory::create();
        $application->setAutoExit(false);
        $application->setCatchExceptions(false);
        $tester = new ApplicationTester($application);
        $exitCode = $tester->run(
            [
                'command' => 'verify',
                'adapter' => 'phpcompatibility',
                '--executable' => $this->executable,
                '--project-root' => $project,
                '--php' => $phpConstraint,
                '--json' => true,
            ],
            ['capture_stderr_separately' => true, 'decorated' => false],
        );

        self::assertSame(
            $expectedFindingCount === 0 ? ExitCode::SUCCESS : ExitCode::VERIFICATION_FINDINGS,
            $exitCode,
            $tester->getErrorOutput(),
        );
        self::assertSame('', $tester->getErrorOutput());

        /** @var array<string, mixed> $report */
        $report = json_decode($tester->getDisplay(), true, 512, JSON_THROW_ON_ERROR);
        self::assertSame($expectedFindingCount, $report['summary']['finding_count']);

        $analysisInvocations = array_values(array_filter(
            $report['invocations'],
            static fn(array $invocation): bool => $invocation['purpose'] === 'analysis',
        ));
        self::assertCount(1, $analysisInvocations);
        self::assertSame($expectedMinors, $analysisInvocations[0]['policy_minors']);

        if ($expectedFindingCount === 1) {
            self::assertCount(1, $report['findings']);
            self::assertSame(
                'PHPCompatibility.Classes.NewClasses.bcmath_numberFound',
                $report['findings'][0]['external_rule_id'],
            );
            self::assertSame('mapped', $report['findings'][0]['mapping_status']);
            self::assertSame(['extension.bcmath_number'], $report['findings'][0]['mapped_rule_ids']);
            self::assertSame(['extension.bcmath_number'], array_column($report['rule_contexts'], 'id'));
        } else {
            self::assertSame([], $report['findings']);
            self::assertSame([], $report['rule_contexts']);
        }

        self::assertSame($before, FixtureTreeSnapshot::capture($project));
    }
}
'''
          write('tests/Integration/BcMathNumberPhpCompatibilityAnalyzerTest.php', analyzer_test)

          list_test = 'tests/Integration/ListCommandTest.php'
          for old, new in [
              ('identical 80-rule id set', 'identical 81-rule id set'),
              ('self::assertCount(80, $rules1);', 'self::assertCount(81, $rules1);'),
              ('self::assertCount(80, $rules2);', 'self::assertCount(81, $rules2);'),
              ("self::assertSame(80, $default['total']);", "self::assertSame(81, $default['total']);"),
              ("self::assertSame(80, $all['total']);", "self::assertSame(81, $all['total']);"),
              ('self::assertCount(80, $allRules);', 'self::assertCount(81, $allRules);'),
              ('self::assertCount(38, $notInRangeInAll);', 'self::assertCount(39, $notInRangeInAll);'),
              ("self::assertStringContainsString('Rules: 80 of 80 shown', $tester->getDisplay());", "self::assertStringContainsString('Rules: 81 of 81 shown', $tester->getDisplay());"),
          ]:
              replace_once(list_test, old, new)

          replace_once(
              'AGENTS.md',
              "Its committed sniff-to-rule mapping covers 45 of the 80 catalogue rules\n(rising from 37 of 72, since all eight rules added this round ship mapped — the first round drawn from\n`UPGRADING`'s New Functions sections rather than a deprecation or behavior-change section, which asks\nexactly the question PHPCompatibility was built to answer instead of one it is structurally blind to),",
              "In published `v0.3.9`, its committed sniff-to-rule mapping covered 45 of the 80 catalogue rules\n(rising from 37 of 72, since all eight rules added that round ship mapped — the first round drawn from\n`UPGRADING`'s New Functions sections rather than a deprecation or behavior-change section, which asks\nexactly the question PHPCompatibility was built to answer instead of one it is structurally blind to).\nCurrent source after issue #19 carries 81 rules, 46 mapped rules and 225 committed sniff ids;",
          )

          english_note = (
              '> **Current source checkout (unreleased after v0.3.9):** issue #19 adds exactly one source-backed '
              '`extension.bcmath_number` PHP 8.4 feature rule and its measured PHPCompatibility mapping. '
              'The source checkout therefore contains **81 rules, 46 mapped rules and 225 committed sniff IDs**. '
              'The published `v0.3.9` release remains the 80-rule / 45-mapped-rule / 224-sniff release described above; '
              'this is not a release or tag claim.\n'
          )
          insert_unreleased_note('README.md', '> **v0.3.9 rule-catalogue expansion:**', english_note)
          replace_once(
              'README.md',
              '| Rule registry | Schema validation, deterministic ordering, and 80 source-backed PHP 8.2–8.5 rules |',
              '| Rule registry | Schema validation, deterministic ordering, and 81 source-backed PHP 8.2–8.5 rules |',
          )
          replace_once(
              'README.md',
              "Every finding keeps the analyzer's own sniff identifier verbatim. Forty-five of this project's eighty\nrules — including the whole `extension.imap_unbundled` surface — have a committed, reviewed mapping from",
              "Every finding keeps the analyzer's own sniff identifier verbatim. Forty-six of this project's eighty-one\nrules — including the whole `extension.imap_unbundled` surface — have a committed, reviewed mapping from",
          )
          replace_once(
              'README.md',
              'mapping coverage still covers only 45 of 80 rules',
              'mapping coverage currently covers 46 of 81 rules',
          )

          zh_note = (
              '> **目前 source checkout（v0.3.9 之後、尚未發布）：** issue #19 僅新增一條有來源依據的 '
              '`extension.bcmath_number` PHP 8.4 feature rule，以及其已量測的 PHPCompatibility mapping。'
              '因此目前 source checkout 為 **81 條規則、46 條具 mapping、225 個已提交 sniff ID**。'
              '已發布的 `v0.3.9` 仍是上方所述的 80 條規則 / 45 條具 mapping / 224 個 sniff ID；'
              '這段說明不代表新的 release 或 tag。\n'
          )
          insert_unreleased_note('README.zh-TW.md', '> **v0.3.9 rule-catalogue expansion：**', zh_note)
          replace_once(
              'README.zh-TW.md',
              '| Rule registry | schema validation、deterministic ordering、80 條 source-backed PHP 8.2–8.5 規則 |',
              '| Rule registry | schema validation、deterministic ordering、81 條 source-backed PHP 8.2–8.5 規則 |',
          )
          replace_once(
              'README.zh-TW.md',
              '每筆 finding 都會保留 analyzer 自己的 sniff identifier 原文。本專案 80 條規則中有 45 條——包含整個',
              '每筆 finding 都會保留 analyzer 自己的 sniff identifier 原文。本專案 81 條規則中有 46 條——包含整個',
          )
          replace_once(
              'README.zh-TW.md',
              'mapping coverage 目前仍只涵蓋 80 條規則中的 45 條',
              'mapping coverage 目前涵蓋 81 條規則中的 46 條',
          )

          replace_once(
              'site/index.html',
              '<ul class="hero-facts" role="list"><li>80 source-backed rules</li><li>PHP 8.2–8.5 coverage</li><li>Real PHPCompatibility verify adapter</li></ul>',
              '<ul class="hero-facts" role="list"><li>81 source-backed rules in source</li><li>PHP 8.2–8.5 coverage</li><li>Real PHPCompatibility verify adapter</li></ul>',
          )
          replace_once(
              'site/index.html',
              'Mapping coverage still covers only 45 of 80 rules, so growing further source-backed PHP rules and their proven mappings',
              'Mapping coverage in the current source checkout covers 46 of 81 rules, so growing further source-backed PHP rules and their proven mappings',
          )
          PY

      - name: Install source dependencies
        shell: bash
        run: composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts

      - name: Regenerate affected CLI goldens and Skill examples from the real CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          cli = ['php', 'bin/php-modern-guidelines']

          def run(args: list[str], expected_exit: int = 0) -> str:
              result = subprocess.run(cli + args, cwd=root, text=True, capture_output=True)
              if result.returncode != expected_exit:
                  raise SystemExit(
                      f'command failed ({result.returncode}, expected {expected_exit}): {cli + args}\n'
                      f'stdout:\n{result.stdout}\nstderr:\n{result.stderr}'
                  )
              if result.stderr:
                  raise SystemExit(f'command wrote unexpected stderr: {cli + args}\n{result.stderr}')
              return result.stdout

          fixture = (root / 'tests/fixtures/projects/caret-8-2').resolve()
          cli_dir = root / 'tests/fixtures/cli'
          list_cases = [
              ([], 'list-rules-caret-8-2.txt'),
              (['--all'], 'list-rules-caret-8-2--all.txt'),
              (['--mode=single-target'], 'list-rules-caret-8-2--mode-single-target.txt'),
              (['--mode=single-target', '--all'], 'list-rules-caret-8-2--mode-single-target--all.txt'),
              (['--kind=deprecated'], 'list-rules-caret-8-2--kind-deprecated.txt'),
              (['--category=extension'], 'list-rules-caret-8-2--category-extension.txt'),
              (['--status=applicable'], 'list-rules-caret-8-2--status-applicable.txt'),
              (['--extension=curl'], 'list-rules-caret-8-2--extension-curl.txt'),
              (['--minor=8.5'], 'list-rules-caret-8-2--minor-8-5.txt'),
          ]
          for extra, filename in list_cases:
              rendered = run([f'--project-root={fixture}', *extra])
              rendered = rendered.replace(str(fixture), '@PROJECT_ROOT@')
              (cli_dir / filename).write_text(rendered, encoding='utf-8')

          application_factory = (root / 'src/ApplicationFactory.php').read_text(encoding='utf-8')
          version_match = re.search(r"public const VERSION = '([^']+)';", application_factory)
          if version_match is None:
              raise SystemExit('could not determine ApplicationFactory::VERSION')
          version = version_match.group(1)

          doctor_cases = [
              ('caret-8-2', [], 'doctor-caret-8-2.txt', 0),
              ('caret-8-2', ['--json'], 'doctor-caret-8-2.json', 0),
              ('no-composer-json', [], 'doctor-no-composer-json.txt', 0),
              ('malformed-composer-json', [], 'doctor-malformed-composer-json.txt', 2),
              ('malformed-composer-json', ['--json'], 'doctor-malformed-composer-json.json', 2),
          ]
          for fixture_name, extra, filename, expected_exit in doctor_cases:
              project = (root / 'tests/fixtures/projects' / fixture_name).resolve()
              rendered = run(['doctor', f'--project-root={project}', *extra], expected_exit)
              rendered = rendered.replace(str(project), '@PROJECT_ROOT@').replace(version, '@VERSION@')
              (cli_dir / filename).write_text(rendered, encoding='utf-8')

          skill_path = root / 'skills/php-modern-guidelines/SKILL.md'
          skill = skill_path.read_text(encoding='utf-8')

          def replace_console(command: str, output: str) -> None:
              nonlocal_skill = None

          def with_console(text: str, command: str, output: str) -> str:
              start_token = f'```console\n$ {command}\n'
              start = text.find(start_token)
              if start < 0:
                  raise SystemExit(f'Skill console command not found: {command}')
              body_start = start + len(start_token)
              end = text.find('\n```', body_start)
              if end < 0:
                  raise SystemExit(f'Skill console closing fence not found: {command}')
              normalized = output.rstrip('\n')
              return text[:body_start] + normalized + text[end:]

          deprecated_output = run(['list-rules', f'--project-root={fixture}', '--kind=deprecated'])
          deprecated_output = deprecated_output.replace(str(fixture), '<app>')
          skill = with_console(
              skill,
              'php bin/php-modern-guidelines list-rules --project-root=/path/to/app --kind=deprecated',
              deprecated_output,
          )

          doctor_output = run(['doctor', f'--project-root={fixture}'])
          doctor_output = doctor_output.replace(str(fixture), '<app>').replace(version, '<version>')
          skill = with_console(
              skill,
              'php bin/php-modern-guidelines doctor --project-root=/path/to/app',
              doctor_output,
          )
          skill_path.write_text(skill, encoding='utf-8')
          PY

      - name: Validate scoped changes before committing
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          php -l tests/Unit/Rule/BcMathNumberApplicabilityTest.php
          php -l tests/Integration/BcMathNumberPhpCompatibilityAnalyzerTest.php
