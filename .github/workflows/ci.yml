name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
      - run: composer check

  phar:
    name: PHAR build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          ini-values: phar.readonly=0
          tools: box:4.7.0
      - run: composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts --no-dev
      - run: box validate box.json.dist

      - name: Build the PHAR twice and compare archive contents
        shell: bash
        run: |
          set -euo pipefail
          box compile --config=box.json.dist --no-parallel
          mv build/php-modern-guidelines.phar build/first.phar
          box compile --config=box.json.dist --no-parallel
          php tools/phar-content-digest.php build/first.phar > build/first.digest
          php tools/phar-content-digest.php build/php-modern-guidelines.phar > build/second.digest
          diff -u build/first.digest build/second.digest
          rm build/first.phar build/first.digest build/second.digest

      - name: Smoke-test the PHAR
        shell: bash
        run: |
          set -euo pipefail
          phar=build/php-modern-guidelines.phar
          fixture=tests/fixtures/projects/caret-8-2
          version="$(sed -n "s/.*public const VERSION = '\([^']*\)';.*/\1/p" src/ApplicationFactory.php)"
          actual="$(php "$phar" version)"
          if [[ "$actual" != "php-modern-guidelines $version" ]]; then
            echo "PHAR reports \"$actual\", expected \"php-modern-guidelines $version\"" >&2
            exit 1
          fi
          php "$phar" list-rules --project-root="$fixture" --kind=deprecated
          php "$phar" explain language.property_hooks --project-root="$fixture" --json > /dev/null
          php "$phar" doctor --project-root="$fixture" --json > /dev/null

          php <<'PHP'
          <?php

          require 'vendor/autoload.php';

          $forbiddenAnalyzers = [
              'phpcompatibility/php-compatibility',
              'squizlabs/php_codesniffer',
              'phpstan/phpstan-deprecation-rules',
              'rector/rector',
          ];

          foreach ($forbiddenAnalyzers as $package) {
              if (\Composer\InstalledVersions::isInstalled($package, false)) {
                  fwrite(STDERR, sprintf("Analyzer package %s must not be bundled in the PHAR.\n", $package));
                  exit(1);
              }
          }

          $archive = new Phar('build/php-modern-guidelines.phar');
          foreach (new RecursiveIteratorIterator($archive) as $entry) {
              if ($entry->getFilename() === 'FakeVerificationAdapter.php') {
                  fwrite(STDERR, "The test-only fake verification adapter must not be bundled in the PHAR.\n");
                  exit(1);
              }
          }

          $archivePath = realpath('build/php-modern-guidelines.phar');
          $sourceSchema = file_get_contents('schemas/verification.schema.json');
          $bundledSchema = is_string($archivePath)
              ? file_get_contents('phar://' . $archivePath . '/schemas/verification.schema.json')
              : false;
          if (!is_string($sourceSchema) || $bundledSchema !== $sourceSchema) {
              fwrite(STDERR, "The PHAR must contain the exact canonical verification schema.\n");
              exit(1);
          }
          PHP

          missing_executable=/definitely/not-installed/phpcs
          if [[ -e "$missing_executable" ]]; then
            echo "The PHAR smoke-test sentinel unexpectedly exists: $missing_executable" >&2
            exit 1
          fi

          verify_stdout=build/verify-unavailable.json
          verify_stderr=build/verify-unavailable.stderr
          set +e
          php "$phar" verify phpcompatibility \
            --executable="$missing_executable" \
            --project-root="$fixture" \
            --json \
            > "$verify_stdout" 2> "$verify_stderr"
          verify_exit=$?
          set -e

          if [[ "$verify_exit" -ne 7 ]]; then
            echo "Unavailable PHAR adapter exited $verify_exit, expected 7." >&2
            cat "$verify_stderr" >&2
            exit 1
          fi
          if [[ -s "$verify_stderr" ]]; then
            echo "Unavailable PHAR adapter wrote to stderr." >&2
            cat "$verify_stderr" >&2
            exit 1
          fi

          VERIFY_STDOUT="$verify_stdout" MISSING_EXECUTABLE="$missing_executable" php <<'PHP'
          <?php

          require 'vendor/autoload.php';

          $path = getenv('VERIFY_STDOUT');
          $missingExecutable = getenv('MISSING_EXECUTABLE');
          if (!is_string($path) || !is_string($missingExecutable)) {
              fwrite(STDERR, "Missing PHAR smoke-test environment.\n");
              exit(1);
          }

          $raw = file_get_contents($path);
          if (!is_string($raw)) {
              fwrite(STDERR, "Could not read the PHAR verification report.\n");
              exit(1);
          }

          try {
              $reportObject = json_decode($raw, false, 512, JSON_THROW_ON_ERROR);
              $report = json_decode($raw, true, 512, JSON_THROW_ON_ERROR);
          } catch (JsonException $exception) {
              fwrite(STDERR, sprintf("PHAR verification report is not valid JSON: %s\n", $exception->getMessage()));
              exit(1);
          }

          $expectedTopLevelKeys = [
              'output_version',
              'status',
              'exit_code',
              'adapter',
              'policy',
              'invocations',
              'summary',
              'reason',
              'rule_contexts',
              'findings',
          ];
          $expectedAdapter = [
              'id' => 'phpcompatibility',
              'executable' => '<external>/phpcs',
              'tool_version' => null,
          ];
          $expectedSummary = [
              'invocation_count' => 0,
              'finding_count' => 0,
              'mapped_finding_count' => 0,
              'unmapped_finding_count' => 0,
              'mapping_count' => 0,
              'mapped_rule_count' => 0,
          ];

          $valid = is_array($report)
              && array_keys($report) === $expectedTopLevelKeys
              && ($report['output_version'] ?? null) === '1.0.0'
              && ($report['status'] ?? null) === 'unavailable'
              && ($report['exit_code'] ?? null) === 7
              && ($report['adapter'] ?? null) === $expectedAdapter
              && ($report['policy']['projection_status'] ?? null) === 'not_evaluated'
              && ($report['policy']['planned_invocations'] ?? null) === []
              && ($report['invocations'] ?? null) === []
              && ($report['summary'] ?? null) === $expectedSummary
              && ($report['reason']['code'] ?? null) === 'adapter.executable_unavailable'
              && is_string($report['reason']['message'] ?? null)
              && $report['reason']['message'] !== ''
              && ($report['rule_contexts'] ?? null) === []
              && ($report['findings'] ?? null) === []
              && !str_contains($raw, $missingExecutable)
              && $reportObject instanceof stdClass
              && (new \ModernPhpGuidelines\Support\JsonSchemaValidator(
                  \ModernPhpGuidelines\Support\PackagePaths::verificationSchemaPath(),
              ))->validate($reportObject) === [];

          if (!$valid) {
              fwrite(STDERR, "PHAR verification report does not match the unavailable-adapter contract.\n");
              exit(1);
          }
          PHP

      - name: Compare PHAR output with the source checkout
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/fixtures/projects/caret-8-2
          php build/php-modern-guidelines.phar resolve --project-root="$fixture" --json > build/phar-policy.json
          php bin/php-modern-guidelines resolve --project-root="$fixture" --json > build/source-policy.json
          diff -u build/source-policy.json build/phar-policy.json
