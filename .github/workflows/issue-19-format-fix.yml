name: Issue 19 formatting fix

on:
  push:
    branches:
      - issue-19-bcmath-number

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: issue-19-bcmath-number
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact formatter diff and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/Unit/Verification/Adapter/PhpCompatibilityMappingTest.php')
          text = path.read_text(encoding='utf-8')
          old = "        'PHPCompatibility.Classes.NewClasses.bcmath_numberFound' => ['extension.bcmath_number'],\n"
          new = "            'PHPCompatibility.Classes.NewClasses.bcmath_numberFound' => ['extension.bcmath_number'],\n"
          if text.count(old) != 1:
              raise SystemExit('expected exact unformatted mapping line once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/issue-19-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Unit/Verification/Adapter/PhpCompatibilityMappingTest.php
          git commit -m "style: align BcMath mapping fixture"
          git push origin HEAD:issue-19-bcmath-number
